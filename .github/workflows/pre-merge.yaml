name: "Pre Merge"

on:
  workflow_dispatch:

  pull_request:
    branches:
      - main

jobs:
  build:
    uses: ./.github/workflows/build.yaml
    secrets: inherit
    with:
      is-development: true
      is-latest: false
      is-stable: false

  go-generated:
    # On a Renovate branch, pushes the regenerated code itself.
    uses: scality/workflows/.github/workflows/go-generated.yaml@1c3bb83b992d0a512c08755606ee6439b26c463b # v2.13.0
    secrets:
      ACTIONS_APP_PRIVATE_KEY: ${{ secrets.ACTIONS_APP_PRIVATE_KEY }}
    with:
      commands: |
        go mod tidy
        go generate ./...
        make manifests generate
      push-to-renovate-branches: true
      actions-app-id: ${{ vars.ACTIONS_APP_ID }}

  lint:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Run linters
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0

  test:
    uses: ./.github/workflows/test.yml
    secrets: inherit

  test-e2e:
    uses: ./.github/workflows/test-e2e.yml
    secrets: inherit

  pre-merge:
    name: Pre Merge
    # Single check for rulesets to require: GitHub reports one check per job, never one per workflow
    # always(): a job skipped because a dependency failed reports success and would let the PR merge
    if: always()
    needs:
      - build
      - go-generated
      - lint
      - test
      - test-e2e
    runs-on: ubuntu-24.04
    steps:
      - name: Fail if a pre-merge job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
